name: Phoveus tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Check changed server modules parse
        run: |
          node --check server.js
          node --check phoveus-yield.js
          node --check integrations/termix/yield-agent.js
          node --check phoveus-local-execution.js
          node --check phoveus-local-execution-cli.js
